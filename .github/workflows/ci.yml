# PR 과 main 에 올라갈 때 도는 시험
#  - check: 린트, 빌드, 코스 데이터 점검, 같이하기 서버 시험. 1분 남짓
#  - e2e: 헤드리스 크롬 화면 시험. 시험 컴퓨터에 그래픽 카드가 없어 3D 를 CPU 로 그려서 몇 분 걸린다.
#    병합을 막는 필수 검사로 걸지 않고 결과만 본다 (실패하면 tests/screenshots 화면을 내려받아 본다)
#    .md 파일만 바뀌었으면 화면이 달라질 일이 없으니 건너뛴다
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:courses
      - run: npm run test:server

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 비교할 앞 커밋: PR 이면 PR 이 갈라져 나온 main, main 에 올라간 것이면 바로 앞 main
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # 바뀐 파일을 못 읽거나 하나라도 .md 가 아니면 시험을 돌린다
          if git fetch --depth=1 origin "$BASE" 2>/dev/null && files=$(git diff --name-only "$BASE" HEAD) && [ -n "$files" ] && ! grep -qv '\.md$' <<< "$files"; then
            echo "문서만 바뀌어 화면 시험을 건너뛴다"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.changes.outputs.code == 'true'
        run: npm ci
      - if: steps.changes.outputs.code == 'true'
        run: npm run build
      - if: steps.changes.outputs.code == 'true'
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/screenshots
          if-no-files-found: ignore

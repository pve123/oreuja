    <path fill="none" stroke="#ffd58a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 26" d="M120 470 L196 420 L166 392 L236 350 L222 324 L256 306"/>
    <path d="M256 306 V266" stroke="#fdf6ec" stroke-width="8" stroke-linecap="round"/>
    <path d="M256 266 L296 278 L256 292 Z" fill="#ff6b6b"/>
  </g>
</svg>

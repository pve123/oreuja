<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 방구석 등반대 앱 아이콘: 밤 남색 하늘에 뜨는 해, 겹친 능선, 정상까지 오르는 등산로 (첫 화면과 같은 색) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2c47"/>
      <stop offset="0.62" stop-color="#3b4a74"/>
      <stop offset="1" stop-color="#8e7a8c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff1c2"/>
      <stop offset="0.55" stop-color="#ffd58a"/>
      <stop offset="1" stop-color="#ff8a5b"/>
    </radialGradient>
    <clipPath id="round"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="332" cy="238" r="64" fill="url(#sun)"/>

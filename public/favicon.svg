<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 오르자 앱 아이콘: 정상에 깃발을 꽂고 선글라스를 낀 산. 굵은 검정 테두리의 스티커 느낌 -->
  <defs>
    <clipPath id="round"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#round)" stroke="#141414" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <rect width="512" height="512" fill="#ff7eb6" stroke="none"/>
    <!-- 해 -->
    <circle cx="400" cy="110" r="46" fill="#ffe14d"/>
    <!-- 산과 눈 덮인 꼭대기 -->
    <path d="M40 470 L256 120 L472 470 Z" fill="#7be495"/>
    <path d="M256 120 L300 192 L278 182 L256 200 L234 182 L212 192 Z" fill="#fff"/>
    <!-- 선글라스: 다리, 두 알, 알에 비친 빛 -->
    <path d="M168 300 H344" fill="none"/>
    <path d="M170 296 h70 q0 50 -36 50 q-34 0 -34 -50 Z M272 296 h70 q0 50 -36 50 q-34 0 -34 -50 Z" fill="#141414" stroke="none"/>
    <path d="M186 308 l18 -6 M288 308 l18 -6" stroke="#fff" stroke-width="7"/>
    <!-- 씩 웃는 입 -->
    <path d="M226 392 q30 22 64 -6" fill="none"/>
    <!-- 정상 깃발 -->
    <path d="M256 122 V52"/>
    <path d="M256 52 L314 70 L256 90 Z" fill="#ff4d4d"/>
  </g>
</svg>

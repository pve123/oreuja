<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 노치·홈바까지 화면을 쓰고, 안전 영역은 CSS 의 env(safe-area-inset-*) 로 비킨다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c2c47" />
    <meta name="color-scheme" content="dark" />
    <title>방구석 등반대</title>
    <meta name="description" content="버튼 하나로 진짜 등산로를 따라 정상까지 올라요. 설치 없이 바로 시작해요." />
    <!-- 홈 화면에 추가(PWA). 설치하면 주소창 없이 앱처럼 열린다 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="등반대" />
    <!-- 링크를 카카오톡·슬랙에 붙였을 때 보이는 카드. 그림(og:image)과 주소는 절대 주소가 필요해 빌드할 때 vite.config.ts 의 socialMeta 가 넣는다 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="방구석 등반대" />
    <meta property="og:description" content="버튼 하나로 진짜 등산로를 따라 정상까지 올라요. 설치 없이 바로 시작해요." />
    <meta property="og:locale" content="ko_KR" />
    <!--
      고른 산(src/lib/mountains.ts 가 브라우저에 기억)의 지형·코스 데이터를 JS 를 받는 동안 같이 받아 둔다.
      src/lib/data.ts 의 fetch 가 이 응답을 그대로 쓴다. 기억이 없으면 북한산
    -->
    <script>
      ;(function () {
        var m = null
        try {
          m = JSON.parse(localStorage.getItem('hiking-metaverse:mountain') || 'null')
        } catch (e) {}
        if (!m || !/^[a-z0-9-]+$/.test(m.id)) m = { id: 'bukhansan' }
        var files = ['/data/mountains.json', '/data/' + m.id + '/terrain.bin', '/data/' + m.id + '/terrain.json', '/data/' + m.id + '/courses.json']
        files.forEach(function (href) {
          var l = document.createElement('link')
          l.rel = 'preload'
          l.as = 'fetch'
          l.crossOrigin = 'anonymous'
          l.href = href
          document.head.appendChild(l)
        })
      })()
    </script>
    <!--
      첫 화면: 새벽 산을 오르는 등산객 (봉우리 그림은 모든 산이 같이 쓴다). JS 번들을 받기 전에 바로 보이도록 HTML·CSS 를 여기에 직접 둔다.
      로딩 진행만큼 등산객이 등산로를 따라 정상으로 오른다 (src/lib/splash.ts).
      장면이 그려지면 걷히고, 그때 화면 패널들이 차례로 들어온다 (src/index.css 의 hud-enter).
    -->
    <style>
      #splash {
        --ink: #fdf6ec;
        --sub: rgba(253, 246, 236, 0.72);
        --trail: #ffd58a;
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: hidden;
        color: var(--ink);
        font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
        /* 새벽: 위는 밤 남색, 아래로 갈수록 해 뜨는 복숭아빛 */
        background: linear-gradient(180deg, #1c2c47 0%, #3b4a6b 38%, #a7798a 66%, #f0b48e 86%, #f7cf9f 100%);
        transition: opacity 0.9s ease, visibility 0.9s, filter 0.9s ease;
      }
      /* 끝날 때 안개가 걷히듯 흐려지며 사라진다 */
      #splash.done {
        opacity: 0;
        visibility: hidden;
        filter: blur(6px);
      }
      .splash-ridges {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 46vh;
        min-height: 240px;
      }
      .splash-mist {
        position: absolute;
        left: -20%;
        width: 140%;
        height: 60px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, rgba(255, 240, 225, 0.35), transparent 70%);
        filter: blur(8px);
        animation: splash-mist 14s ease-in-out infinite alternate;
      }
      .splash-mist.m1 {
        bottom: 22vh;
      }
      .splash-mist.m2 {
        bottom: 10vh;
        animation-duration: 18s;
        animation-direction: alternate-reverse;
      }
      .splash-center {
        position: absolute;
        left: 50%;
        top: 46%;
        transform: translate(-50%, -50%);
        width: min(360px, calc(100vw - 48px));
        display: grid;
        justify-items: center;
        text-align: center;
      }
      .splash-climb {
        width: 100%;
        height: auto;
        overflow: visible;
      }
      .splash-eyebrow {
        margin: 6px 0 0;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.2em;
        padding-left: 0.2em;
        color: var(--trail);
      }
      .splash-title {
        margin: 6px 0 0;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 0.14em;
        padding-left: 0.14em;
        text-shadow: 0 2px 18px rgba(20, 28, 48, 0.35);
      }
      .splash-meta {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-top: 10px;
        font-size: 14px;
        color: var(--sub);
      }
      .splash-error {
        display: none;
        margin-top: 18px;
        padding: 10px 20px;
        border: 0;
        border-radius: 999px;
        background: var(--trail);
        color: #2b2130;
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
      }
      #splash.failed .splash-error {
        display: block;
      }
      @keyframes splash-mist {
        to {
          transform: translateX(12%);
        }
      }
      @keyframes splash-glow {
        50% {
          transform: scale(1.5);
          opacity: 0.4;
        }
      }
      @keyframes splash-ellipsis {
        0% {
          content: '';
        }
        25% {
          content: '.';
        }
        50% {
          content: '..';
        }
        75% {
          content: '...';
        }
      }
      @keyframes splash-bob {
        50% {
          transform: translateY(-1.5px);
        }
      }
      /* 위치는 #splash-hiker 의 transform 속성이 정하고, 흔들림은 안쪽 그룹에만 준다 (CSS transform 이 속성을 덮어쓰지 않게) */
      /* SVG 요소에 CSS transform 을 줄 때 기준점을 그림 전체가 아니라 요소 자신으로 */
      .splash-bob,
      .splash-glow {
        transform-box: fill-box;
        transform-origin: center;
      }
      .splash-bob {
        animation: splash-bob 0.5s ease-in-out infinite;
      }
      .splash-glow {
        animation: splash-glow 1.6s ease-in-out infinite;
      }
      /* JS 를 받는 동안: 진행률을 지어내지 않고 말줄임표만 움직여 멈추지 않았음을 보인다 */
      #splash:not(.live) #splash-sub::after {
        content: '';
        display: inline-block;
        width: 1.2em;
        text-align: left;
        animation: splash-ellipsis 1.2s steps(4) infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-mist,
        .splash-bob,
        .splash-glow,
        #splash-sub::after {
          animation: none;
        }
        #splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" role="status" aria-live="polite" aria-label="방구석 등반대를 불러오는 중">
      <!-- 멀리서 가까이 겹친 능선과 안개 -->
      <svg class="splash-ridges" viewBox="0 0 1200 400" preserveAspectRatio="none" aria-hidden="true">
        <path fill="#7c6a86" opacity="0.55" d="M0 210 L120 170 L230 196 L360 120 L470 176 L600 110 L720 160 L840 128 L980 180 L1100 140 L1200 170 V400 H0 Z" />
        <path fill="#4c5677" opacity="0.8" d="M0 260 L140 214 L260 246 L380 190 L520 250 L660 196 L800 236 L930 200 L1060 244 L1200 214 V400 H0 Z" />
        <path fill="#2b3a52" d="M0 318 L170 270 L300 300 L450 258 L610 312 L760 268 L900 300 L1050 262 L1200 296 V400 H0 Z" />
      </svg>
      <div class="splash-mist m1" aria-hidden="true"></div>
      <div class="splash-mist m2" aria-hidden="true"></div>

      <div class="splash-center">
        <!-- 백운대·인수봉·만경대 세 봉우리와 정상까지 지그재그 등산로. 진행만큼 등산객이 오르고 길이 채워진다 -->
        <svg class="splash-climb" viewBox="0 0 320 170" aria-hidden="true">
          <path fill="rgba(253,246,236,0.1)" stroke="rgba(253,246,236,0.85)" stroke-width="2" stroke-linejoin="round" d="M6 160 L74 92 L98 108 L150 30 L176 58 L196 44 L246 104 L268 92 L314 160 Z" />
          <path id="splash-route" fill="none" stroke="rgba(253,246,236,0.35)" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round" d="M40 158 L96 140 L70 124 L128 106 L112 92 L148 70 L140 52 L150 32" />
          <path id="splash-walked" stroke-dasharray="0 1000" fill="none" stroke="var(--trail)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M40 158 L96 140 L70 124 L128 106 L112 92 L148 70 L140 52 L150 32" />
          <!-- 정상 깃발 -->
          <path d="M150 30 V12" stroke="rgba(253,246,236,0.9)" stroke-width="1.6" />
          <path d="M150 12 L164 16 L150 21 Z" fill="#ff6b6b" />
          <!-- 등산객 -->
          <g id="splash-hiker" transform="translate(40 158)">
            <g class="splash-bob">
              <circle class="splash-glow" r="7" fill="rgba(255,213,138,0.3)" />
              <circle r="3.6" fill="var(--trail)" />
            </g>
          </g>
        </svg>
        <p class="splash-eyebrow">집에서 오르는 진짜 산</p>
        <h1 class="splash-title">방구석 등반대</h1>
        <div class="splash-meta">
          <span id="splash-sub">등산화 끈 묶는 중</span>
        </div>
        <button class="splash-error" id="splash-retry" type="button" onclick="location.reload()">다시 시도</button>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
